name: DataverseNL report

on:
  workflow_dispatch:
    inputs:
      include_access_requests:
        description: "Check pending access requests (needs DATAVERSE_API_TOKEN secret with curator rights)"
        type: boolean
        default: false
  schedule:
    - cron: "0 5 1 * *"   # 1st of every month, 05:00 UTC

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build report
        env:
          # API TOKEN: comes from the repository secret, never from the code.
          # Settings > Secrets and variables > Actions > New repository secret
          # Name: DATAVERSE_API_TOKEN
          DATAVERSE_API_TOKEN: ${{ secrets.DATAVERSE_API_TOKEN }}
          INCLUDE_ACCESS_REQUESTS: ${{ inputs.include_access_requests && 'true' || 'false' }}
          LOGO_PATH: assets/um-logo.png
        run: python dataverse_report.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: dataverse-report-${{ github.run_number }}
          path: output/
          retention-days: 90
