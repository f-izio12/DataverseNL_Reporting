name: DataverseNL report

on:
  workflow_dispatch:
    inputs:
      include_access_requests:
        description: "Check pending access requests (needs DATAVERSE_API_TOKEN secret with curator rights)"
        type: boolean
        default: true
  schedule:
    - cron: "0 5 1 * *"   # 1st of every month, 05:00 UTC

permissions:
  contents: read

# Never run two publications at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build report
        env:
          # API TOKEN: comes from the repository secret, never from the code.
          # Settings > Secrets and variables > Actions > New repository secret
          # Name: DATAVERSE_API_TOKEN
          DATAVERSE_API_TOKEN: ${{ secrets.DATAVERSE_API_TOKEN }}
          # Scheduled runs always check access requests, so the website stays complete.
          INCLUDE_ACCESS_REQUESTS: ${{ (github.event_name == 'schedule' || inputs.include_access_requests) && 'true' || 'false' }}
          # Titles of never-published drafts are left off the public website; set to "true" to show them.
          PUBLISH_DRAFT_TITLES: "false"
          LOGO_PATH: assets/um-logo.png
        run: python dataverse_report.py

      - name: Upload public report
        uses: actions/upload-artifact@v6
        with:
          name: dataverse-report-${{ github.run_number }}
          path: output/public/
          retention-days: 90

      - name: Upload admin page
        uses: actions/upload-artifact@v6
        with:
          name: dataverse-ADMIN-${{ github.run_number }}
          path: output/admin/
          retention-days: 30

      - name: Prepare website
        uses: actions/upload-pages-artifact@v5
        with:
          path: output/site/

  publish:
    needs: report
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to publish to GitHub Pages
      id-token: write   # to prove the publication comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
